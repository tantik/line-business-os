name: DB tests

# pgTAP suite (supabase/tests) against a throwaway local Postgres started by
# the Supabase CLI inside the runner. Local stack only: no secrets, no link,
# no Cloud project is ever touched.

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: db-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pgtap:
    name: pgTAP (supabase test db)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the CLI version in the root package.json devDependencies
      # (supabase 2.107.0) so CI and local `pnpm exec supabase` agree.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      # Starts only the Postgres container, then applies every migration and
      # the seed (supabase/seed/seed.sql) -- same as a local `db reset`.
      - name: Start local database
        run: supabase db start

      - name: Run pgTAP suite
        run: supabase test db
